const b2u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pass){const enc=new TextEncoder();
  const km=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b2u(SALT),iterations:150000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b2u(IV)},key,b2u(CT));
  return new TextDecoder().decode(buf);}
async function tryPass(pass){try{const html=await unlock(pass);try{sessionStorage.setItem("tdp",pass);}catch(_){}
  document.open();document.write(html);document.close();}
  catch(err){document.getElementById("e").textContent="Incorrect passphrase.";}}
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();
